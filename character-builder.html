<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS - Generador de Personaje por Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      color: white;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }
    .sidebar {
      width: 300px;
      background: #0f172a;
      border-right: 1px solid #374151;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn {
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      background: #dc2626;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .btn.secondary {
      background: #1f2937;
      border: 1px solid #374151;
    }
    .panel-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .panel-item {
      background: #1f2937;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      color: #e5e7eb;
      text-align: left;
      width: 100%;
    }
    .panel-item.active {
      border-color: #dc2626;
      background: rgba(220, 38, 38, 0.12);
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #374151;
      background: #1f2937;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }
    .header h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #111827;
    }
    .msg {
      max-width: 80%;
      padding: 0.9rem 1rem;
      border-radius: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      margin-left: auto;
      background: #dc2626;
      color: white;
      border-bottom-right-radius: 0.2rem;
    }
    .msg.ai {
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-bottom-left-radius: 0.2rem;
    }
    .composer {
      border-top: 1px solid #374151;
      background: #1f2937;
      padding: 1rem;
      display: flex;
      gap: 0.75rem;
      align-items: end;
    }
    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 200px;
      resize: vertical;
      border-radius: 0.75rem;
      border: 1px solid #374151;
      background: #111827;
      color: white;
      padding: 0.85rem 1rem;
      font: inherit;
    }
    .status {
      color: #9ca3af;
      font-size: 0.8rem;
    }
    .system-box {
      background: rgba(59, 130, 246, 0.08);
      border-left: 3px solid #60a5fa;
      color: #bfdbfe;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      margin: 0.5rem 0 1rem 0;
      font-size: 0.85rem;
    }
    @media (max-width: 768px) {
      .app { display: block; }
      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #374151;
      }
      .main { height: calc(100vh - 250px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">NEXUS</div>
      <button class="btn" onclick="startNewSession()">+ Nuevo personaje</button>
      <div class="panel-list" id="sessionsList"></div>
      <button class="btn secondary" onclick="saveCurrentCharacter()">Guardar personaje</button>
    </aside>

    <main class="main">
      <header class="header">
        <h2 id="sessionTitle">Generador de personaje</h2>
        <div class="status" id="statusText">Modo: conversación natural</div>
      </header>

      <div class="chat">
        <div class="messages" id="messages"></div>
        <div class="composer">
          <textarea id="input" placeholder="Ej: Lucia es una artista urbana de 21 años..."></textarea>
          <button class="btn" onclick="sendMessage()">Enviar</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'nexus_character_builder_v1';
    let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let currentSessionId = null;

    const systemPrompt = `Eres un asistente experto en creación de personajes para roleplay y ficción.
Tu trabajo es ayudar al usuario a construir personajes en conversación natural.

Reglas:
- No uses formularios ni campos obligatorios.
- El usuario describe al personaje en lenguaje natural.
- Tú debes completar, enriquecer, ordenar y expandir la información de manera creativa.
- Haz preguntas cortas y útiles solo cuando haga falta.
- Cuando el usuario da detalles, debes integrar y profundizar: edad, apariencia, personalidad, motivaciones, historia, habilidades, conflictos, estilo de habla, relaciones, mundo, etc.
- Puedes proponer variaciones si el usuario quiere cambiar la dirección.
- Si el usuario no da detalles, haz una propuesta breve y coherente.
- El objetivo es que el personaje termine bien definido y usable para un chat de roleplay.
- Haz la respuesta en español, natural, con tono cálido y creativo.
- Cuando el usuario diga cosas como 'ya está', 'listo', 'terminado', 'guardalo', debes resumir el personaje final.`;

    function createSession(title = 'Nuevo personaje') {
      const id = Date.now().toString();
      const session = {
        id,
        title,
        messages: [
          {
            role: 'ai',
            text: '¡Perfecto! Hablemos del personaje. Puedes empezar con algo como: "Lucia es una artista urbana de 21 años..." y yo lo desarrollaré con detalles, personalidad, historia y contexto. Cuando quieras, te ayudo a pulirlo o a dejarlo listo para roleplay.'
          }
        ]
      };
      sessions.unshift(session);
      currentSessionId = id;
      persist();
      render();
      renderMessages();
    }

    function startNewSession() {
      const title = `Personaje ${sessions.length + 1}`;
      createSession(title);
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }

    function renderSessionsList() {
      const list = document.getElementById('sessionsList');
      list.innerHTML = '';

      sessions.forEach(session => {
        const btn = document.createElement('button');
        btn.className = 'panel-item' + (session.id === currentSessionId ? ' active' : '');
        btn.textContent = session.title;
        btn.onclick = () => {
          currentSessionId = session.id;
          render();
          renderMessages();
        };
        list.appendChild(btn);
      });
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      const session = sessions.find(s => s.id === currentSessionId);
      container.innerHTML = '';

      if (!session) return;

      session.messages.forEach(msg => {
        const el = document.createElement('div');
        el.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');
        el.textContent = msg.text;
        container.appendChild(el);
      });

      container.scrollTop = container.scrollHeight;
    }

    function render() {
      const session = sessions.find(s => s.id === currentSessionId);
      document.getElementById('sessionTitle').textContent = session ? session.title : 'Generador de personaje';
      renderSessionsList();
    }

    function addMessage(role, text) {
      const session = sessions.find(s => s.id === currentSessionId);
      if (!session) return;
      session.messages.push({ role, text });
      persist();
      renderMessages();
    }

    function saveCurrentCharacter() {
      const session = sessions.find(s => s.id === currentSessionId);
      if (!session) return;

      const text = session.messages
        .filter(m => m.role === 'user' || m.role === 'ai')
        .map(m => m.text)
        .join('\n\n');

      const nameMatch = text.match(/(?:nombre|llama|se llama|es una persona llamada|es\s+)([A-ZÁÉÍÓÚÑ][a-záéíóúñA-ZÁÉÍÓÚÑ\s]+)/i);
      const title = (nameMatch && nameMatch[1]) ? nameMatch[1].trim() : `Personaje ${session.title}`;
      session.title = title;
      persist();
      render();
      alert('Personaje guardado correctamente.');
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const value = input.value.trim();
      if (!value || !currentSessionId) return;

      addMessage('user', value);
      input.value = '';

      const session = sessions.find(s => s.id === currentSessionId);
      const history = session.messages
        .map(msg => `${msg.role === 'user' ? 'Usuario' : 'IA'}: ${msg.text}`)
        .join('\n\n');

      const prompt = `${systemPrompt}\n\nHistorial de conversación:\n${history}\n\nEl usuario quiere continuar o ajustar el personaje.`;

      try {
        const apiKey = localStorage.getItem('nexus_openrouter_key') || '';
        if (!apiKey) {
          addMessage('ai', 'Para activar la creación con IA, necesitas poner tu API Key de OpenRouter en localStorage bajo la clave "nexus_openrouter_key".');
          return;
        }

        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gryphe/mythomist-7b',
            messages: [{ role: 'system', content: prompt }, { role: 'user', content: value }],
            temperature: 0.9,
            max_tokens: 1200
          })
        });

        if (!response.ok) throw new Error('Error en la API');

        const data = await response.json();
        const aiText = data?.choices?.[0]?.message?.content || 'No pude generar la respuesta.';
        addMessage('ai', aiText);
      } catch (error) {
        addMessage('ai', 'No se pudo conectar con la IA. Verifica la API Key de OpenRouter y que la conexión esté disponible.');
      }
    }

    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    if (sessions.length === 0) {
      createSession();
    } else {
      currentSessionId = sessions[0].id;
      render();
      renderMessages();
    }
  </script>
</body>
</html>
