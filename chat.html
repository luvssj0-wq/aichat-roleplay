<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEXUS - Chat Multimodelo con Acceso a Internet" />
    <meta name="theme-color" content="#111827" />
    <title>NEXUS - Chat Avanzado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #0f172a;
            border-right: 1px solid #374151;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid #374151;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .new-chat-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #b91c1c;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .chat-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background-color: #1f2937;
            border: 1px solid transparent;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-item:hover {
            background-color: #2d3748;
            border-color: #374151;
        }

        .chat-item.active {
            background-color: #dc2626;
            border-color: #dc2626;
        }

        .chat-item-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.875rem;
        }

        .chat-item-delete {
            opacity: 0;
            cursor: pointer;
            color: #9ca3af;
            transition: opacity 0.2s;
        }

        .chat-item:hover .chat-item-delete {
            opacity: 1;
        }

        .chat-item-delete:hover {
            color: #dc2626;
        }

        .sidebar-footer {
            padding: 1rem;
            border-top: 1px solid #374151;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .config-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .config-label {
            font-size: 0.75rem;
            color: #9ca3af;
            font-weight: 600;
        }

        .config-input, .config-select {
            padding: 0.5rem;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 0.375rem;
            color: white;
            font-size: 0.75rem;
        }

        .config-input:focus, .config-select:focus {
            outline: none;
            border-color: #dc2626;
        }

        /* Main Chat */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #111827;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1f2937;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .chat-title {
            font-size: 1.25rem;
            font-weight: 600;
            flex: 1;
        }

        .model-indicator {
            font-size: 0.75rem;
            color: #9ca3af;
            padding: 0.25rem 0.75rem;
            background-color: #111827;
            border-radius: 0.375rem;
        }

        .chat-actions {
            display: flex;
            gap: 0.5rem;
        }

        .chat-btn {
            padding: 0.5rem 1rem;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }

        .chat-btn:hover {
            background-color: #4b5563;
        }

        .chat-btn-delete {
            background-color: #dc2626;
        }

        .chat-btn-delete:hover {
            background-color: #b91c1c;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .messages-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            text-align: center;
            flex-direction: column;
            gap: 1rem;
        }

        .messages-empty-icon {
            font-size: 3rem;
            opacity: 0.5;
        }

        .message {
            display: flex;
            gap: 1rem;
            animation: messageIn 0.3s ease-out;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .message.user .message-content {
            flex-direction: row-reverse;
        }

        .message-bubble {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            word-wrap: break-word;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .message.assistant .message-bubble {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #d1d5db;
        }

        .message.user .message-bubble {
            background-color: #dc2626;
            color: white;
        }

        .message-text {
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }

        .message-actions {
            opacity: 0;
            display: flex;
            gap: 0.25rem;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0.25rem;
            transition: color 0.2s;
        }

        .message-action-btn:hover {
            color: #dc2626;
        }

        .message-web-search {
            font-size: 0.75rem;
            color: #4ade80;
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* Input */
        .input-area {
            padding: 1.5rem;
            border-top: 1px solid #374151;
            background-color: #1f2937;
            display: flex;
            gap: 1rem;
            flex-direction: column;
        }

        .input-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.75rem;
        }

        .option-check {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
        }

        .option-check input {
            cursor: pointer;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        .message-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            min-height: 45px;
        }

        .message-input:focus {
            outline: none;
            border-color: #dc2626;
        }

        .send-btn {
            padding: 0.75rem 1.5rem;
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .send-btn:hover:not(:disabled) {
            background-color: #b91c1c;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .modal-text {
            color: #d1d5db;
            margin-bottom: 1.5rem;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .modal-btn-cancel {
            background-color: #374151;
            color: white;
        }

        .modal-btn-cancel:hover {
            background-color: #4b5563;
        }

        .modal-btn-confirm {
            background-color: #dc2626;
            color: white;
        }

        .modal-btn-confirm:hover {
            background-color: #b91c1c;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -260px;
                height: 100vh;
                z-index: 200;
                transition: left 0.3s ease;
            }

            .sidebar.open {
                left: 0;
            }

            .main-chat {
                width: 100%;
            }

            .message-content {
                max-width: 85%;
            }

            .toggle-sidebar {
                display: block;
            }
        }

        @media (min-width: 769px) {
            .toggle-sidebar {
                display: none;
            }
        }

        .toggle-sidebar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #dc2626;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .typing {
            display: inline-flex;
            gap: 0.25rem;
        }

        .typing span {
            width: 0.5rem;
            height: 0.5rem;
            background-color: #9ca3af;
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {
            0%, 60%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-0.5rem);
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">NEXUS</div>
                <button class="new-chat-btn" onclick="createNewChat()">+ Nuevo Chat</button>
            </div>

            <div class="chats-list" id="chatsList"></div>

            <div class="sidebar-footer">
                <!-- Seleccionar IA -->
                <div class="config-section">
                    <label class="config-label">🤖 Modelo IA</label>
                    <select id="modelSelect" class="config-select" onchange="changeModel()">
                        <option value="gryphe/mythomist-7b">🎭 MythoMist (Roleplay)</option>
                        <option value="teknium/openhermes-2.5-mistral-7b">🧠 OpenHermes (Análisis)</option>
                        <option value="meta-llama/llama-2-70b-chat">🦙 Llama 2 (Versátil)</option>
                        <option value="mistralai/mistral-7b-instruct">🔮 Mistral (Rápido)</option>
                    </select>
                </div>

                <!-- API Key OpenRouter -->
                <div class="config-section">
                    <label class="config-label">🔑 API Key (OpenRouter)</label>
                    <input 
                        type="password" 
                        id="apiKey" 
                        class="config-input" 
                        placeholder="sk-or-..."
                    >
                </div>

                <!-- API Key Parallel (Web Search) -->
                <div class="config-section">
                    <label class="config-label">🌐 Parallel API (Búsqueda)</label>
                    <input 
                        type="password" 
                        id="parallelKey" 
                        class="config-input" 
                        placeholder="pk-..."
                    >
                </div>
            </div>
        </div>

        <!-- Main Chat -->
        <div class="main-chat">
            <div class="chat-header">
                <div>
                    <div class="chat-title" id="chatTitle">Selecciona un chat</div>
                    <div class="model-indicator" id="modelIndicator">Modelo: -</div>
                </div>
                <div class="chat-actions">
                    <button class="chat-btn" onclick="clearCurrentChat()" id="clearChatBtn" style="display:none;">
                        🗑️ Vaciar
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="messages-empty">
                    <div class="messages-empty-icon">💬</div>
                    <p>Selecciona un chat para comenzar</p>
                </div>
            </div>

            <div class="input-area" id="inputArea" style="display:none;">
                <div class="input-options">
                    <label class="option-check">
                        <input type="checkbox" id="webSearchToggle" checked>
                        <span>🌐 Búsqueda Web</span>
                    </label>
                </div>
                <div class="input-group">
                    <textarea 
                        class="message-input" 
                        id="messageInput" 
                        placeholder="Escribe tu mensaje..."
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">📤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Confirmación</div>
            <div class="modal-text" id="modalText">¿Estás seguro?</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn modal-btn-confirm" id="confirmBtn" onclick="confirmAction()">Confirmar</button>
            </div>
        </div>
    </div>

    <button class="toggle-sidebar" id="toggleSidebarBtn" onclick="toggleSidebar()">☰</button>

    <script>
        // Estado Global
        const state = {
            chats: JSON.parse(localStorage.getItem('nexusChats')) || [],
            currentChatId: localStorage.getItem('currentChatId') || null,
            currentModel: localStorage.getItem('currentModel') || 'gryphe/mythomist-7b',
            pendingAction: null,
        };

        const MODELS = {
            'gryphe/mythomist-7b': '🎭 MythoMist (Roleplay)',
            'teknium/openhermes-2.5-mistral-7b': '🧠 OpenHermes (Análisis)',
            'meta-llama/llama-2-70b-chat': '🦙 Llama 2 (Versátil)',
            'mistralai/mistral-7b-instruct': '🔮 Mistral (Rápido)',
        };

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            document.getElementById('modelSelect').value = state.currentModel;
            updateModelIndicator();

            loadChats();
            if (state.chats.length === 0) {
                createNewChat();
            } else if (state.currentChatId) {
                selectChat(state.currentChatId);
            } else {
                selectChat(state.chats[0].id);
            }

            // Tecla Enter
            document.getElementById('messageInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });

        function changeModel() {
            state.currentModel = document.getElementById('modelSelect').value;
            localStorage.setItem('currentModel', state.currentModel);
            updateModelIndicator();
        }

        function updateModelIndicator() {
            const modelName = MODELS[state.currentModel] || state.currentModel;
            document.getElementById('modelIndicator').textContent = `Modelo: ${modelName}`;
        }

        async function sendMessage() {
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat) return;

            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('Por favor ingresa tu API Key de OpenRouter');
                return;
            }

            // Agregar mensaje del usuario
            const userMsg = {
                id: Date.now().toString(),
                role: 'user',
                content: message,
                timestamp: new Date().toISOString(),
            };

            chat.messages.push(userMsg);
            input.value = '';
            renderMessages();
            saveChats();

            // Deshabilitar botón y mostrar typing
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                let assistantContent = '';
                const useWebSearch = document.getElementById('webSearchToggle').checked;

                // Búsqueda web (opcional)
                if (useWebSearch) {
                    const webResults = await performWebSearch(message);
                    if (webResults) {
                        assistantContent = `[Búsqueda Web Realizada]\n\n${webResults}\n\n`;
                    }
                }

                // Llamar a OpenRouter
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                    },
                    body: JSON.stringify({
                        model: state.currentModel,
                        messages: chat.messages.map(m => ({
                            role: m.role,
                            content: m.content,
                        })),
                        temperature: 0.8,
                        max_tokens: 2048,
                    }),
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                assistantContent += data.choices[0].message.content;

                const assistantMsg = {
                    id: (Date.now() + 1).toString(),
                    role: 'assistant',
                    content: assistantContent,
                    timestamp: new Date().toISOString(),
                    webSearchUsed: useWebSearch,
                };

                chat.messages.push(assistantMsg);
                renderMessages();
                saveChats();
            } catch (error) {
                console.error('Error:', error);
                const errorMsg = {
                    id: (Date.now() + 1).toString(),
                    role: 'assistant',
                    content: `❌ Error: ${error.message}`,
                    timestamp: new Date().toISOString(),
                };
                chat.messages.push(errorMsg);
                renderMessages();
                saveChats();
            } finally {
                sendBtn.disabled = false;
                document.getElementById('messageInput').focus();
            }
        }

        async function performWebSearch(query) {
            const parallelKey = document.getElementById('parallelKey').value.trim();
            if (!parallelKey) return null;

            try {
                const response = await fetch('https://api.parallel.ai/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${parallelKey}`,
                    },
                    body: JSON.stringify({
                        query: query,
                        limit: 3,
                    }),
                });

                if (!response.ok) return null;

                const data = await response.json();
                return data.results
                    ?.map(r => `📌 ${r.title}\n${r.snippet}\n🔗 ${r.url}`)
                    .join('\n\n') || null;
            } catch (error) {
                console.error('Web search error:', error);
                return null;
            }
        }

        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                name: `Chat ${state.chats.length + 1}`,
                messages: [],
                createdAt: new Date().toISOString(),
            };

            state.chats.push(newChat);
            saveChats();
            selectChat(newChat.id);
            renderChats();
        }

        function selectChat(chatId) {
            const chat = state.chats.find(c => c.id === chatId);
            if (!chat) return;

            state.currentChatId = chatId;
            localStorage.setItem('currentChatId', chatId);
            renderChats();
            renderMessages();
            updateChatTitle();

            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('clearChatBtn').style.display = 'block';
        }

        function renderChats() {
            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = '';

            state.chats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const chatItem = document.createElement('div');
                chatItem.className = `chat-item ${isActive ? 'active' : ''}`;
                chatItem.innerHTML = `
                    <span class="chat-item-name" onclick="selectChat('${chat.id}')">${chat.name}</span>
                    <span class="chat-item-delete" onclick="deleteChat('${chat.id}', event)">×</span>
                `;
                chatsList.appendChild(chatItem);
            });
        }

        function renderMessages() {
            const chat = state.chats.find(c => c.id === state.currentChatId);
            const container = document.getElementById('messagesContainer');

            if (!chat || chat.messages.length === 0) {
                container.innerHTML = `
                    <div class="messages-empty">
                        <div class="messages-empty-icon">💬</div>
                        <p>Comienza una conversación</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            chat.messages.forEach((msg) => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.role}`;
                msgDiv.innerHTML = `
                    <div class="message-content">
                        <div class="message-bubble">
                            <div class="message-text">${escapeHtml(msg.content)}</div>
                            <div class="message-actions">
                                <button class="message-action-btn" onclick="deleteMessage('${msg.id}', event)" title="Borrar">×</button>
                            </div>
                        </div>
                        ${msg.webSearchUsed ? '<div class="message-web-search">🌐 Incluye resultados de búsqueda web</div>' : ''}
                    </div>
                `;
                container.appendChild(msgDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        function updateChatTitle() {
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (chat) {
                document.getElementById('chatTitle').textContent = chat.name;
            }
        }

        function deleteMessage(msgId, event) {
            event.stopPropagation();
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat) return;

            chat.messages = chat.messages.filter(m => m.id !== msgId);
            renderMessages();
            saveChats();
        }

        function deleteChat(chatId, event) {
            event.stopPropagation();
            state.pendingAction = () => {
                state.chats = state.chats.filter(c => c.id !== chatId);
                saveChats();

                if (state.currentChatId === chatId) {
                    if (state.chats.length > 0) {
                        selectChat(state.chats[0].id);
                    } else {
                        createNewChat();
                    }
                }

                renderChats();
                closeModal();
            };

            showModal('Eliminar Chat', '¿Estás seguro?');
        }

        function clearCurrentChat() {
            state.pendingAction = () => {
                const chat = state.chats.find(c => c.id === state.currentChatId);
                if (chat) {
                    chat.messages = [];
                    renderMessages();
                    saveChats();
                }
                closeModal();
            };

            showModal('Vaciar Chat', '¿Eliminar todos los mensajes?');
        }

        function showModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('confirmModal').classList.remove('active');
            state.pendingAction = null;
        }

        function confirmAction() {
            if (state.pendingAction) {
                state.pendingAction();
            }
        }

        function saveChats() {
            localStorage.setItem('nexusChats', JSON.stringify(state.chats));
        }

        function loadChats() {
            state.chats = JSON.parse(localStorage.getItem('nexusChats')) || [];
        }

        function loadSettings() {
            const savedModel = localStorage.getItem('currentModel');
            if (savedModel) state.currentModel = savedModel;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleSidebarBtn');
            if (window.innerWidth <= 768 && sidebar.classList.contains('open') && 
                !sidebar.contains(event.target) && !toggleBtn.contains(event.target)) {
                sidebar.classList.remove('open');
            }
        });
    </script>
</body>
</html>
